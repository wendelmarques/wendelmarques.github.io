          <p>Sistemas de Geração Aumentada por Recuperação (RAG - Retrieval-Augmented Generation) tornaram-se a espinha dorsal para conectar modelos de linguagem a documentos corporativos sem custos extras de fine-tuning.</p>
          
          <p>Neste artigo, veremos um exemplo completo de código usando <strong>LangChain</strong>, <strong>Qdrant</strong> e um modelo de <strong>Cross-Encoder Reranker</strong> da HuggingFace.</p>

          <h2>Exemplo Prático 1: Splitter Semântico & Embeddings</h2>
          <p>Primeiro, configuramos a divisão inteligente do documento e a geração de vetores densos:</p>

<pre><code># rag_pipeline.py
from langchain_community.document_loaders import PyPDFLoader
from langchain.text_splitter import RecursiveCharacterTextSplitter
from langchain_community.embeddings import HuggingFaceEmbeddings
from langchain_community.vectorstores import Qdrant

# 1. Carregar documento
loader = PyPDFLoader("manual_tecnico.pdf")
documents = loader.load()

# 2. Fragmentação com sobreposição
text_splitter = RecursiveCharacterTextSplitter(
    chunk_size=500,
    chunk_overlap=100,
    separators=["\\n\\n", "\\n", " ", ""]
)
chunks = text_splitter.split_documents(documents)

# 3. Embeddings usando modelo em português / multilíngue
embeddings = HuggingFaceEmbeddings(
    model_name="sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
)

# 4. Indexação no Qdrant Vector Store
vectordb = Qdrant.from_documents(
    chunks,
    embeddings,
    location=":memory:",
    collection_name="conhecimento_tecnico"
)</code></pre>

          <h2>Exemplo Prático 2: Re-ordenação com Cross-Encoder (Reranking)</h2>
          <p>Após recuperar os 20 fragmentos mais similares, usamos um <code>CrossEncoder</code> para reordenar por relevância antes de enviar o contexto ao LLM:</p>

<pre><code>from sentence_transformers import CrossEncoder

# Carrega modelo de reranking especializado
reranker = CrossEncoder('BAAI/bge-reranker-large')

def retrieve_and_rerank(query, top_k_retrieval=20, top_k_final=3):
    # 1. First-Stage Retrieval (Vector Search)
    docs = vectordb.similarity_search(query, k=top_k_retrieval)
    
    # 2. Formatar pares (Query, Documento) para o Reranker
    pairs = [[query, doc.page_content] for doc in docs]
    
    # 3. Calcular pontuação de relevância exata
    scores = reranker.predict(pairs)
    
    # 4. Ordenar e selecionar os Top K mais relevantes
    doc_score_pairs = sorted(zip(docs, scores), key=lambda x: x[1], reverse=True)
    top_docs = [doc for doc, score in doc_score_pairs[:top_k_final]]
    
    return top_docs

# Teste da busca aprimorada
query = "Qual a tolerância máxima de temperatura do motor?"
context_chunks = retrieve_and_rerank(query)
for i, chunk in enumerate(context_chunks, 1):
    print(f"--- Chunk {i} ---")
    print(chunk.page_content[:150] + "...")</code></pre>

          <h2>Exemplo Prático 1: Servidor de Inferência com FastAPI</h2>
          <p>Estruturamos a API com validação estrita dos dados de entrada usando <code>Pydantic</code>:</p>

<pre><code># app/main.py
from fastapi import FastAPI, HTTPException
from pydantic import BaseModel
import joblib
import numpy as np

app = FastAPI(title="ML Inference Service", version="1.0.0")

# Carrega modelo e scaler salvos
model = joblib.load("model.joblib")
scaler = joblib.load("scaler.joblib")

class PredictRequest(BaseModel):
    idade: int
    renda: float
    score_credito: float

class PredictResponse(BaseModel):
    aprovado: bool
    probabilidade: float

@app.get("/health")
def health_check():
    return {"status": "healthy"}

@app.post("/predict", response_model=PredictResponse)
def predict(data: PredictRequest):
    try:
        features = np.array([[data.idade, data.renda, data.score_credito]])
        scaled_features = scaler.transform(features)
        
        proba = float(model.predict_proba(scaled_features)[0][1])
        prediction = proba >= 0.5
        
        return PredictResponse(aprovado=prediction, probabilidade=proba)
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))</code></pre>

<pre><code># Dockerfile
FROM python:3.11-slim

COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

COPY model.joblib .
COPY scaler.joblib .

EXPOSE 8000

CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]</code></pre>

          <p>Confira o código-fonte completo para processar os dados do ENEM e gerar um mapa de coropletas interativo em HTML usando Python e Folium.</p>

          <h2>Código Completo em Python</h2>

<pre><code># processa_enem_mapa.py
import pandas as pd
import folium

# 1. Carregamento dos dados com colunas selecionadas
cols = ['SG_UF_PROVA', 'NU_NOTA_MT', 'NU_NOTA_CN', 'NU_NOTA_LC', 'NU_NOTA_CH', 'NU_NOTA_REDACAO']
df = pd.read_csv('MICRODADOS_ENEM_2023.csv', sep=';', encoding='latin-1', usecols=cols)

# 2. Tratamento de valores ausentes e cálculo da média geral
df_clean = df.dropna()
df_clean['MEDIA_GERAL'] = df_clean[['NU_NOTA_MT', 'NU_NOTA_CN', 'NU_NOTA_LC', 'NU_NOTA_CH', 'NU_NOTA_REDACAO']].mean(axis=1)

# 3. Agrupamento por estado (UF)
df_uf = df_clean.groupby('SG_UF_PROVA')['MEDIA_GERAL'].mean().reset_index()
print(df_uf.head())

# 4. Criação do mapa centralizado no Brasil
mapa = folium.Map(location=[-14.2350, -51.9253], zoom_start=4, tiles='cartodbpositron')

# 5. Adição da camada de coropleta (Choropleth)
folium.Choropleth(
    geo_data='br_states.json',
    name='choropleth',
    data=df_uf,
    columns=['SG_UF_PROVA', 'MEDIA_GERAL'],
    key_on='feature.id',
    fill_color='YlOrRd',
    fill_opacity=0.75,
    line_opacity=0.3,
    legend_name='Média Geral no ENEM por Estado (UF)'
).add_to(mapa)

# 6. Salva o arquivo HTML resultante
mapa.save('mapa_enem_brasil.html')
print("Mapa interativo gerado com sucesso: mapa_enem_brasil.html")</code></pre>
